name: Build from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q -o ./*.zip -d work
          ROOT=$(dirname "$(find work -maxdepth 4 -type d -name viewer | head -1)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build viewer into the app
        run: |
          node "$ROOT/viewer/build.js"
          cp "$ROOT/viewer/dist/FabSteelViewer.html" "$ROOT/android/app/src/main/assets/"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: ${{ env.ROOT }}/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FabSteelViewer-android-apk
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: bash
        run: |
          mkdir -p work
          unzip -q -o ./*.zip -d work
          ROOT=$(dirname "$(find work -maxdepth 4 -type d -name viewer | head -1)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build viewer into the app
        shell: bash
        run: |
          node "$ROOT/viewer/build.js"
          cp "$ROOT/viewer/dist/FabSteelViewer.html" "$ROOT/electron/app/"
      - name: Build Electron app
        shell: bash
        working-directory: ${{ env.ROOT }}/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npx electron-builder --win portable nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: FabSteelViewer-windows
          path: ${{ env.ROOT }}/electron/dist/*.exe
