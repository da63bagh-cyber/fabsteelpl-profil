name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build viewer and copy into the app
        run: |
          node viewer/build.js
          cp viewer/dist/FabSteelViewer.html android/app/src/main/assets/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FabSteelViewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FabSteelViewer-android-apk
          path: FabSteelViewer.apk
